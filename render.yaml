services:
  - type: web
    name: meera-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEBIUS_MODEL
        value: openai/gpt-oss-120b
      - key: ALLOWED_ORIGINS
        value: https://www.meera.social,https://meera.social,http://localhost:5173
    healthCheckPath: /health
